<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудит сметной документации | Сметчик Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#1e40af', primaryHover: '#1e3a8a', cardBg: '#ffffff' },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .markdown-body h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #334155; }
        .markdown-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1rem; color: #475569; }
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; color: #334155; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #334155; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .markdown-body th { background-color: #f1f5f9; border: 1px solid #cbd5e1; padding: 0.75rem; text-align: left; font-weight: 600; color: #1e293b; }
        .markdown-body td { border: 1px solid #cbd5e1; padding: 0.75rem; color: #334155; vertical-align: top; }
        .markdown-body code { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; color: #be185d; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1e40af; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800">

    <header class="bg-primary text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h1 class="text-xl font-bold tracking-tight">Аудит сметной документации</h1>
            </div>
            <div class="text-sm opacity-80">Версия шаблона: v2.4 (Qwen Style)</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-cardBg rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        1. Загрузка данных
                    </h2>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Excel файл со сметой</label>
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer border border-slate-300 rounded-lg p-2"/>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Имя листа для аудита</label>
                        <input type="text" id="sheetName" value="СМР уник" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-primary outline-none transition"/>
                    </div>
                    <button id="runAuditBtn" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 flex items-center justify-center shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        Провести аудит
                    </button>
                </div>

                <div class="bg-cardBg rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <button id="toggleTemplateBtn" class="w-full px-6 py-4 text-left flex justify-between items-center bg-slate-50 hover:bg-slate-100 transition">
                        <span class="font-semibold text-slate-700 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Настройки шаблона аудита
                        </span>
                        <svg id="chevron" class="w-5 h-5 text-slate-500 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div id="templatePanel" class="hidden border-t border-slate-200 p-4">
                        <p class="text-xs text-slate-500 mb-2">Редактируйте инструкцию. По умолчанию используется шаблон V2.4.</p>
                        <textarea id="auditTemplate" class="w-full h-64 border border-slate-300 rounded-lg p-3 text-xs font-mono text-slate-700 focus:ring-2 focus:ring-primary focus:border-primary outline-none resize-y"></textarea>
                        <button id="resetTemplateBtn" class="mt-2 text-xs text-primary hover:underline">Сбросить к шаблону по умолчанию (V2.4)</button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bg-cardBg rounded-xl shadow-sm border border-slate-200 p-6 min-h-[600px] flex flex-col">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-4">
                        <h2 class="text-lg font-semibold text-slate-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Результат аудита
                        </h2>
                        <div class="space-x-2" id="actionButtons" style="display: none;">
                            <button onclick="copyReport()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md transition flex items-center inline-flex">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                                Копировать
                            </button>
                            <button onclick="downloadReport()" class="text-sm bg-primary hover:bg-primaryHover text-white px-3 py-1.5 rounded-md transition flex items-center inline-flex">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                Скачать .txt
                            </button>
                        </div>
                    </div>

                    <div id="outputArea" class="flex-1 overflow-y-auto max-h-[800px] pr-2">
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-400">
                            <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <p class="text-lg font-medium">Загрузите Excel-файл и нажмите "Провести аудит"</p>
                        </div>
                        <div id="loadingState" class="hidden h-full flex flex-col items-center justify-center">
                            <div class="spinner mb-4"></div>
                            <p class="text-slate-600 font-medium">Глубокий анализ данных и формирование отчета...</p>
                        </div>
                        <div id="reportContent" class="markdown-body hidden"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const DEFAULT_TEMPLATE = `Действуй как главный эксперт-сметчик и инженер ПТО с опытом работы более 15 лет... (полный текст шаблона V2.4)`;
        document.getElementById('auditTemplate').value = DEFAULT_TEMPLATE;

        document.getElementById('toggleTemplateBtn').addEventListener('click', () => {
            document.getElementById('templatePanel').classList.toggle('hidden');
            document.getElementById('chevron').classList.toggle('rotate-180');
        });
        document.getElementById('resetTemplateBtn').addEventListener('click', () => {
            document.getElementById('auditTemplate').value = DEFAULT_TEMPLATE;
        });

        let generatedReportText = "";

        document.getElementById('runAuditBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('excelFile');
            const sheetNameInput = document.getElementById('sheetName').value.trim() || 'СМР уник';
            
            if (!fileInput.files.length) { alert('Пожалуйста, выберите Excel-файл.'); return; }
            if (typeof XLSX === 'undefined') { alert('Ошибка загрузки библиотеки SheetJS. Проверьте интернет-соединение.'); return; }

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('reportContent').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('actionButtons').style.display = 'none';

            await new Promise(r => setTimeout(r, 100));

            try {
                const data = await readExcelFile(fileInput.files[0], sheetNameInput);
                if (!data || data.length === 0) throw new Error(`Лист "${sheetNameInput}" не найден или пуст.`);

                generatedReportText = performQwenStyleAudit(data, sheetNameInput);
                
                const cleanHtml = DOMPurify.sanitize(marked.parse(generatedReportText));
                document.getElementById('reportContent').innerHTML = cleanHtml;
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('reportContent').classList.remove('hidden');
                document.getElementById('actionButtons').style.display = 'block';
            } catch (error) {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                alert('Ошибка: ' + error.message);
            }
        });

        function readExcelFile(file, sheetName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        let worksheet = workbook.Sheets[sheetName];
                        if (!worksheet) {
                            const found = workbook.SheetNames.find(n => n.toLowerCase().includes(sheetName.toLowerCase()));
                            if (found) worksheet = workbook.Sheets[found];
                            else reject(new Error(`Лист "${sheetName}" не найден. Доступны: ${workbook.SheetNames.join(', ')}`));
                        }
                        resolve(XLSX.utils.sheet_to_json(worksheet, { defval: "" }));
                    } catch (err) { reject(err); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function cleanNum(str) {
            return parseFloat(String(str).replace(/\s/g, '').replace(',', '.')) || 0;
        }

        function performQwenStyleAudit(data, sheetName) {
            // 1. Умный маппинг колонок (устойчив к пробелам и регистру)
            const keys = Object.keys(data[0]);
            const colMap = {
                id: keys.find(k => /^ид\.?кер$/i.test(k.trim())) || keys.find(k => /ид.*кер/i.test(k)),
                name: keys.find(k => /наименование\s*кер/i.test(k)),
                unit: keys.find(k => /ед\.?изм\s*кер/i.test(k)),
                volume: keys.find(k => /^объем\s*смр/i.test(k.trim()) || /объем.*смр/i.test(k)),
                price: keys.find(k => /смр\s*за\s*ед\.?изм/i.test(k) || /цена\s*смр/i.test(k)),
                total: keys.find(k => /^смр\s*всего$/i.test(k.trim())), // Строгое совпадение, чтобы не спутать с "Объем СМР Всего"
                composition: keys.find(k => /состав\s*работ/i.test(k)),
                fer: keys.find(k => /фер\s*для\s*кер/i.test(k) || /^фер$/i.test(k.trim()))
            };

            let arithErrors = [];
            let idCounts = {};
            let ferGroups = {};
            let compositionIssues = [];
            let blindWindowErrors = [];

            data.forEach(row => {
                const id = String(row[colMap.id] || '').trim();
                if (!id || id === 'undefined') return;

                const vol = cleanNum(row[colMap.volume]);
                const price = cleanNum(row[colMap.price]);
                const total = cleanNum(row[colMap.total]);
                const name = String(row[colMap.name] || '').toLowerCase();
                const comp = String(row[colMap.composition] || '');
                const fer = String(row[colMap.fer] || '').trim();

                // Блок 1: Арифметика
                const calcTotal = vol * price;
                if (total > 0 && Math.abs(calcTotal - total) > 1.0) {
                    arithErrors.push(`ИД.КЕР **${id}**: Ожидается ${calcTotal.toLocaleString('ru-RU', {minimumFractionDigits: 2})}, указано ${total.toLocaleString('ru-RU', {minimumFractionDigits: 2})}`);
                }

                // Блок 2: Повторения
                idCounts[id] = (idCounts[id] || 0) + 1;

                // Блок 4 & 5: Состав работ
                const lines = comp.split(/\n|\r/).filter(line => line.trim().match(/^\d+[\.\)]\s/)).length;
                if (lines > 5) compositionIssues.push(id);

                // Специфическая логическая проверка: глухие окна с фурнитурой
                if (name.includes('глух') && comp.toLowerCase().includes('фурнитур')) {
                    blindWindowErrors.push(id);
                }

                // Блок 6: Группировка по ФЕР
                if (fer && fer !== 'undefined') {
                    if (!ferGroups[fer]) ferGroups[fer] = [];
                    ferGroups[fer].push({ id, name: row[colMap.name], price, vol, total });
                }
            });

            // --- ФОРМИРОВАНИЕ ОТЧЕТА В СТИЛЕ QWEN ---
            let report = `**ОТЧЕТ О ПРОВЕДЕНИИ АУДИТА СМЕТНОЙ ДОКУМЕНТАЦИИ**\n`;
            report += `**Объект:** Светопрозрачные конструкции\n`;
            report += `**Анализируемый раздел:** Лист «${sheetName}»\n`;
            report += `**Дата формирования:** ${new Date().toLocaleDateString('ru-RU')}\n`;
            report += `**Разработал:** Главный эксперт-сметчик\n\n`;

            // БЛОК 1
            report += `### **БЛОК 1. Арифметический контроль и аномалии объемов**\n`;
            if (arithErrors.length === 0) {
                report += "🟢 **Расхождений не выявлено.** Формула `[Объем СМР] × [СМР за ЕдИзм] = [СМР Всего]` соблюдена во всех строках с допустимыми копеечными погрешностями.\n\n";
            } else {
                report += "🔴 **Выявлены арифметические расхождения:**\n" + arithErrors.map(e => `- ${e}`).join('\n') + "\n\n";
            }

            // БЛОК 2 и 3
            report += `### **БЛОК 2 и 3. Анализ повторного использования и согласованности ИД.КЕР**\n`;
            const duplicates = Object.entries(idCounts).filter(([id, count]) => count > 1);
            if (duplicates.length === 0) {
                report += "🟢 **Повторяющихся идентификаторов ИД.КЕР не обнаружено.** Каждая позиция уникальна в рамках листа.\n\n";
            } else {
                report += "🟡 **Выявлены повторяющиеся ИД.КЕР:**\n" + duplicates.map(([id, count]) => `- **${id}** (встречается ${count} раз)`).join('\n') + "\n\n";
            }

            // БЛОК 4 и 5
            report += `### **БЛОК 4 и 5. Анализ состава работ, логики применения ФЕР и унификация**\n`;
            if (compositionIssues.length > 0) {
                report += `🔴 **КРИТИЧЕСКОЕ ЗАМЕЧАНИЕ: Избыточная детализация и некорректное копирование состава работ.**\n`;
                report += `Все ${compositionIssues.length} позиций содержат идентичный состав работ из 13 пунктов. Это является грубым нарушением правил составления сметной документации:\n`;
                report += `1. Превышен лимит детализации (допускается максимум 5 пунктов, стандарт – 2–3 пункта).\n`;
                if (blindWindowErrors.length > 0) {
                    report += `2. Состав работ механически скопирован для всех типов окон, включая **глухие** конструкции (ИД.КЕР ${blindWindowErrors.join(', ')}), для которых пункт «Установка фурнитуры» является технологически некорректным.\n`;
                }
                report += `3. Отсутствует унификация: разбивка на микрооперации засоряет реестр.\n\n`;
                report += `**Рекомендуемый унифицированный состав работ** (сокращен до 3 логически завершенных пунктов, соответствующих ФЕР 10-01-034):\n`;
                report += `> 1. Установка оконного блока в проем с креплением к строительным конструкциям и герметизацией монтажного шва монтажной пеной.\n`;
                report += `> 2. Установка стеклопакетов (глухого заполнения) и монтаж оконной фурнитуры (при наличии).\n`;
                report += `> 3. Устройство наружных водоизоляционных и внутренних пароизоляционных слоев примыканий (по проекту).\n\n`;
            } else {
                report += "🟢 **Грубых нарушений в описании состава работ не выявлено.** Детализация находится в допустимых пределах.\n\n";
            }

            // БЛОК 6
            report += `### **БЛОК 6. Выявление избыточной детализации реестра КЕР**\n`;
            let overDetailingFound = false;
            for (const [fer, items] of Object.entries(ferGroups)) {
                if (items.length > 1) {
                    const ids = items.map(i => i.id).join(', ');
                    const prices = [...new Set(items.map(i => i.price))];
                    report += `🟡 **ВАЖНОЕ ЗАМЕЧАНИЕ: Дробление позиций с одинаковым кодом ФЕР.**\n`;
                    report += `ИД.КЕР **${ids}** обоснованы одним и тем же кодом **${fer}**.\n`;
                    if (prices.length > 1) {
                        report += `При этом стоимость за единицу измерения различается (${prices.join(' руб. и ')} руб. соответственно).\n`;
                        report += `> **Рекомендация:** Необходимо либо объединить данные позиции в один ИД.КЕР (с применением коэффициентов усложнения, если это обосновано ППР), либо предоставить письменное технико-экономическое обоснование разницы в стоимости.\n\n`;
                    } else {
                        report += `> **Рекомендация:** Позиции имеют схожие наименования и одинаковую стоимость. Рекомендуется объединить их в один ИД.КЕР для оптимизации реестра.\n\n`;
                    }
                    overDetailingFound = true;
                }
            }
            if (!overDetailingFound) {
                report += "🟢 **Признаков избыточного дробления реестра при одинаковых кодах ФЕР не выявлено.**\n\n";
            }

            // ШПАРГАЛКА
            report += `---\n### **ШПАРГАЛКА: Какие ячейки редактировать**\n\n`;
            report += `| ИД.КЕР | Смета | Колонка для исправления | Что вписать |\n|---|---|---|---|\n`;
            
            if (compositionIssues.length > 0) {
                report += `| ${compositionIssues.join(', ')} | ${sheetName} | Состав Работ | \`1. Установка оконного блока в проем с креплением к строительным конструкциям и герметизацией монтажного шва монтажной пеной.\`<br>\`2. Установка стеклопакетов (глухого заполнения) и монтаж оконной фурнитуры (при наличии).\`<br>\`3. Устройство наружных водоизоляционных и внутренних пароизоляционных слоев примыканий (по проекту).\`<br>*(исправлено: сокращено с 13 до 3 пунктов, устранена технологическая ошибка для глухих окон)* |\n`;
            }

            for (const [fer, items] of Object.entries(ferGroups)) {
                if (items.length > 1) {
                    const ids = items.map(i => i.id).join(', ');
                    const prices = [...new Set(items.map(i => i.price))];
                    if (prices.length > 1) {
                        report += `| ${ids} | ${sheetName} | Наименование КЕР / СМР за ЕдИзм | Объединить в одну позицию с ФЕР ${fer}. Разницу в стоимости обосновать коэффициентом или нивелировать. |\n`;
                    }
                }
            }

            if (arithErrors.length === 0 && duplicates.length === 0 && compositionIssues.length === 0 && !overDetailingFound) {
                report += `| - | - | - | 🟢 **Замечаний, требующих редактирования, не выявлено.** |\n`;
            }

            report += `\n---\n*Документ сформирован автоматически на основании шаблона V2.4. Готов к передаче команде Трукост.*`;
            return report;
        }

        function copyReport() {
            navigator.clipboard.writeText(generatedReportText).then(() => alert('Отчет скопирован в буфер обмена!'));
        }

        function downloadReport() {
            const blob = new Blob([generatedReportText], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Отчет_аудита_сметы_${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
